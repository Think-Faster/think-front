services:
  tf-front:
    contrainer_name: tf-front
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}

    ports:
      - "80:80"

    container_name: think-fast-frontend
    restart: unless-stopped

    networks:
      - think-fast-net

networks:
  think-fast-net:
    external: true